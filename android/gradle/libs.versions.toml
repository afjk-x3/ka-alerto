[versions]
# Toolchain. These three must agree with each other, with Gradle (see
# gradle/wrapper/gradle-wrapper.properties) and with the JDK Gradle runs on.
# Bump as a set, not individually.
#   AGP 8.x is NOT usable here: it calls a Gradle internal API removed in Gradle 9.6.
#   AGP versions above 9.3.0 are NOT usable in Android Studio 2026.1.3 ("Quail 3"):
#   its sync hard-refuses anything newer (checked via
#   android.studio.latest.known.compatible.agp.version in the IDE log). The Gradle CLI
#   has no such ceiling and will happily build a newer AGP that Studio then can't sync —
#   confirm against Studio's actual log, not just a green `./gradlew build`, before
#   bumping this past what Studio currently supports.
agp = "9.3.2"
kotlin = "2.4.10"
ksp = "2.3.11"

# SDK levels. compileSdk 37 is the platform actually installed on this machine;
# there is no cmdline-tools, so picking an uninstalled level forces a download.
compileSdk = "37"
targetSdk = "37"
minSdk = "26"

# Libraries
activityCompose = "1.13.0"
composeBom = "2026.08.00"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
maplibre = "13.6.0"
playServicesLocation = "21.4.0"
playServicesNearby = "19.5.0"
room = "2.8.4"
serialization = "1.11.0"
zxing = "3.5.3"

# Test
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Compose — the BOM pins every androidx.compose.* version, so no version.ref below
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Curated ~20-icon set only (ArrowBack, LocationOn, Edit, Close, ...) — NOT
# material-icons-extended, which ships thousands of icons for a much bigger APK.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

# QR encoding for the rescue card (BUILD_TASKS.md day 8). "core" is the pure-Java half
# of ZXing with no Android dependency — deliberately NOT "zxing-android-embedded",
# which pulls in a camera scanner UI this build never needs. Pure Java also means the
# encoder runs in unit tests, so the card's QR is decoded and asserted rather than
# eyeballed. The card is drawn on a Compose Canvas from the bit matrix; no bitmap.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }


# The default "android-sdk" artifact is Vulkan-ONLY (confirmed via a runtime
# UnsupportedOperationException: "This MapLibre Android build supports only VULKAN").
# On this dev machine's x86_64 emulator that produces a SurfaceView which composites
# and self-reports as a loaded map (confirmed in the on-screen view hierarchy — correct
# accessibility description, attribution icon present) but paints every pixel black: no
# crash, no logged error, just an empty framebuffer. "android-sdk-opengl" is a dedicated
# pure-OpenGL build — no multiBackend runtime-switch complexity needed, since we always
# want OpenGL. Revisit on real hardware: a real device's Vulkan driver may render fine,
# making this an emulator-only workaround rather than a permanent constraint.
maplibre-android-sdk = { group = "org.maplibre.gl", name = "android-sdk-opengl", version.ref = "maplibre" }

play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
play-services-nearby = { group = "com.google.android.gms", name = "play-services-nearby", version.ref = "playServicesNearby" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
