<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #FF5A4E; } a:hover { color: #E04036; }
  </style>
</helmet>

<div style="width: 360px; height: 800px; background: #1A0E0D; color: #F2F4F7; display: flex; flex-direction: column; overflow: hidden;">

  <div style="padding: 48px 24px 0 24px; display: flex; flex-direction: column; gap: 8px; align-items: center;">
    <div style="font-size: 28px; font-weight: 700; text-align: center; line-height: 1.15;">Humingi ng tulong</div>
    <div style="font-size: 16px; color: #C9A9A5; text-align: center;">Request rescue</div>
  </div>

  <!-- hold ring -->
  <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
    <div style="position: relative; width: 248px; height: 248px;">
      <svg width="248" height="248" viewBox="0 0 248 248" style="position: absolute; inset: 0; transform: rotate(-90deg);">
        <circle cx="124" cy="124" r="112" fill="none" stroke="#3A1D1B" stroke-width="12"/>
        <circle cx="124" cy="124" r="112" fill="none" stroke="#FF5A4E" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="703.7" stroke-dashoffset="246.3"/>
      </svg>
      <div style="position: absolute; inset: 30px; border-radius: 50%; background: #C42B2B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;">
        <span style="font-size: 44px; font-weight: 700; letter-spacing: 2px; color: #FFFFFF; line-height: 1;">SOS</span>
        <span style="font-size: 17px; color: #FFD9D6;">Hawakan</span>
        <span style="font-size: 13px; color: #F0A8A3;">keep holding</span>
      </div>
    </div>
  </div>

  <div style="padding: 0 24px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <div style="font-size: 17px; font-weight: 600;">Huwag bitawan…</div>
    <div style="font-size: 14px; color: #C9A9A5; text-align: center; line-height: 1.45;">Kailangan ng mahabang pindot para hindi ito<br>maaksidenteng ma-send sa bulsa mo.</div>
  </div>

  <!-- what gets sent -->
  <div style="margin: 24px 16px 0 16px; background: #0D0F12; padding: 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #7C858E;">Ipapadala agad</div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4FA3E3" stroke-width="2" style="flex-shrink: 0;"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 15px;">14.6412, 121.1033</span>
      <span style="font-size: 13px; color: #7C858E;">±6 m</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8B0BA" stroke-width="2" style="flex-shrink: 0;"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.4l3.4 2"/></svg>
      <span style="font-size: 15px;">3:41 AM · ngayon</span>
    </div>
    <div style="font-size: 13px; color: #A8B0BA; line-height: 1.45; border-top: 1px solid #23272C; padding-top: 10px;">Madadagdagan mo ng detalye pagkatapos — hindi hinihintay ng pagpapadala.</div>
  </div>

  <div style="padding: 18px 16px 26px 16px;">
    <div style="height: 56px; border: 1.5px solid #4A2A26; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
      <span style="font-size: 16px; font-weight: 600; color: #C9A9A5;">Kanselahin</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
