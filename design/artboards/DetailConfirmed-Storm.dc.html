<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #FF5A4E; } a:hover { color: #E04036; }
  </style>
</helmet>

<div style="width: 360px; height: 800px; background: #0D0F12; color: #F2F4F7; display: flex; flex-direction: column; overflow: hidden;">

  <!-- map behind -->
  <div style="height: 262px; position: relative; background: #12151A;">
    <svg width="360" height="262" viewBox="0 0 360 262" style="display: block; opacity: 0.55;">
      <rect width="360" height="262" fill="#12151A"/>
      <g fill="#1A1D21">
        <rect x="8" y="8" width="70" height="86"/><rect x="104" y="8" width="92" height="86"/>
        <rect x="222" y="8" width="60" height="86"/>
        <rect x="8" y="150" width="70" height="104"/><rect x="104" y="150" width="92" height="104"/>
      </g>
      <g stroke="#2E343B" stroke-width="9" stroke-linecap="round">
        <path d="M0 122 L360 122"/><path d="M90 0 L90 262"/><path d="M208 0 L208 262"/>
      </g>
      <path d="M10 122 L150 122" stroke="#C42B2B" stroke-width="13" stroke-linecap="round" fill="none"/>
      <circle cx="80" cy="122" r="15" fill="#C42B2B" stroke="#0D0F12" stroke-width="2.5"/>
      <g stroke="#FFFFFF" stroke-width="1.8" fill="none"><circle cx="80" cy="118" r="2.4"/><path d="M80 120.8v5.4M77.4 127L80 124.6l2.6 2.4"/><path d="M74 127l12-12" stroke-width="2"/></g>
      <text x="14" y="115" fill="#7C858E" style="font-family: 'IBM Plex Sans'; font-size: 10px; font-weight: 500;">SAMPALOC ST</text>
    </svg>
    <div style="position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(13,15,18,0.1), rgba(13,15,18,0.85));"></div>
  </div>

  <!-- sheet -->
  <div style="flex-grow: 1; background: #1A1D21; margin-top: -22px; position: relative; display: flex; flex-direction: column; padding: 0 16px 22px 16px;">

    <div style="display: flex; justify-content: center; padding: 10px 0 14px 0;">
      <div style="width: 44px; height: 4px; background: #3A4149;"></div>
    </div>

    <!-- title row -->
    <div style="display: flex; align-items: flex-start; gap: 12px; padding-bottom: 14px;">
      <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1;">
        <div style="font-size: 24px; font-weight: 700; line-height: 1.1;">Sampaloc St</div>
        <div style="font-size: 14px; color: #A8B0BA;">Brgy. Concepcion Uno · 400 m NE</div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #C42B2B; padding: 8px 11px; flex-shrink: 0;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#FFFFFF" stroke-width="1.7"><circle cx="8" cy="3.6" r="2.2"/><path d="M8 6v5M5.6 12.6L8 10.2l2.4 2.4"/><path d="M2.6 13.4l11-11" stroke-width="1.9"/></svg>
        <span style="font-size: 13px; font-weight: 700; color: #FFFFFF;">S3</span>
      </div>
    </div>

    <!-- reading -->
    <div style="background: #0D0F12; padding: 16px; display: flex; align-items: center; gap: 16px; margin-bottom: 12px;">
      <svg width="42" height="58" viewBox="0 0 42 58" style="flex-shrink: 0;">
        <g stroke="#F2F4F7" stroke-width="2.6" fill="none" stroke-linecap="round">
          <circle cx="21" cy="10" r="5.4" fill="#1A1D21"/><path d="M21 15.4v18"/><path d="M21 33.4l-5 15M21 33.4l5 15"/><path d="M13 22h16"/>
        </g>
        <rect x="0" y="30" width="42" height="26" fill="#2F7FBF" opacity="0.35"/>
        <path d="M0 30 q 5.25 -3 10.5 0 t 10.5 0 t 10.5 0 t 10.5 0" stroke="#4FA3E3" stroke-width="2" fill="none"/>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 20px; font-weight: 700;">Hanggang baywang</div>
        <div style="font-size: 15px; color: #A8B0BA;">Waist-deep · walang makakadaan</div>
      </div>
    </div>

    <!-- meta grid -->
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px;">
      <div style="background: #0D0F12; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #7C858E;">Huling ulat</div>
        <div style="font-size: 17px; font-weight: 600;">22 min ago</div>
        <div style="font-size: 13px; color: #A8B0BA; font-family: 'IBM Plex Mono', monospace;">3:14 AM</div>
      </div>
      <div style="background: #0D0F12; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: #7C858E;">Paano dumating</div>
        <div style="display: flex; align-items: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#4FA3E3" stroke-width="1.7"><circle cx="3.4" cy="8" r="1.8"/><circle cx="12.6" cy="4" r="1.8"/><circle cx="12.6" cy="12" r="1.8"/><path d="M5 7.1l6-2.2M5 8.9l6 2.2"/></svg>
          <span style="font-size: 17px; font-weight: 600;">Mesh</span>
        </div>
        <div style="font-size: 13px; color: #A8B0BA; font-family: 'IBM Plex Mono', monospace;">2 hops</div>
      </div>
    </div>

    <!-- confidence -->
    <div style="background: #0D0F12; border-left: 3px solid #F2F4F7; padding: 14px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px;">
      <div style="display: flex; align-items: center; gap: 9px;">
        <svg width="19" height="19" viewBox="0 0 16 16" fill="none" stroke="#F2F4F7" stroke-width="1.9"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2l2 2 3.6-4"/></svg>
        <span style="font-size: 17px; font-weight: 700;">Confirmed</span>
      </div>
      <div style="display: flex; gap: 6px; align-items: center;">
        <div style="height: 6px; flex-grow: 4; background: #4FA3E3;"></div>
        <div style="height: 6px; flex-grow: 1; background: #3A4149;"></div>
      </div>
      <div style="font-size: 14px; color: #A8B0BA; line-height: 1.45;">4 nag-confirm · 0 nag-dispute<br>3 ang napatunayan ng kalapit na phone</div>
    </div>

    <div style="flex-grow: 1;"></div>

    <!-- actions -->
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 14px; color: #A8B0BA; text-align: center;">Nandiyan ka ba ngayon?</div>
      <div style="display: flex; gap: 10px;">
        <div style="flex-grow: 1; height: 64px; background: #F2F4F7; display: flex; align-items: center; justify-content: center; gap: 9px;">
          <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="#0D0F12" stroke-width="2.1"><path d="M4 10.4l4 4 8-8.6"/></svg>
          <span style="font-size: 17px; font-weight: 700; color: #0D0F12;">Tama</span>
        </div>
        <div style="flex-grow: 1; height: 64px; border: 1.5px solid #4A525A; display: flex; align-items: center; justify-content: center; gap: 9px; box-sizing: border-box;">
          <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="#F2F4F7" stroke-width="2.1"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
          <span style="font-size: 17px; font-weight: 700;">Iba na</span>
        </div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
